name: Validate Cloudflare builds

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/cloudflare-workers-opennext]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, backend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and refresh lockfile in runner
        run: npm install
      - name: Build for Cloudflare Workers
        run: npm run cf:build
